<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Studio | Professional Builder</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/builder.css">
    
    <style>
        /* Ensure preview panel works correctly */
        .preview-panel {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 20px;
        }
        
        #cvPreviewFrame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Builder Action Buttons */
        .builder-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 20px;
            padding: 0 5px;
        }

        .btn-preview-large {
            background: white;
            border: 2px solid var(--brand-teal);
            color: var(--brand-teal);
            padding: 10px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(20,184,166,0.1);
        }

        .btn-preview-large:hover {
            background: var(--brand-teal);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(20,184,166,0.2);
        }

        .btn-download-large {
            background: linear-gradient(135deg, var(--brand-teal), #0d9488);
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(20,184,166,0.3);
            transition: all 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-download-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(20,184,166,0.4);
        }

        .btn-download-large i, .btn-preview-large i {
            font-size: 1rem;
        }

        /* Adjust editor panel to accommodate buttons */
        .editor-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .editor-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Hide navbar buttons if they exist */
        .nav-actions .btn-preview,
        .nav-actions .btn-download,
        .nav-actions .btn-template {
            display: none;
        }
    </style>
</head>
<body>

<!-- Navbar will be loaded here -->

<!-- Main Studio Layout -->
<div class="studio-container">
    <!-- EDITOR PANEL -->
    <div class="editor-panel">
        <!-- Builder Action Buttons - Added here -->
        <div class="builder-actions">
            <button class="btn-preview-large" id="previewBtn">
                <i class="fa-regular fa-eye"></i>
                Preview CV
            </button>
            <button class="btn-download-large" id="downloadBtn">
                <i class="fa-regular fa-download"></i>
                Download PDF
            </button>
        </div>

        <div class="editor-content">
            <div class="editor-header">
                <h3>CV Builder</h3>
                <span id="templateName">Professional Template</span>
            </div>

            <!-- PERSONAL INFO -->
            <span class="section-label"><i class="fa-regular fa-user me-2"></i>Personal Information</span>
            <input type="text" id="fullName" class="form-control" placeholder="Full Name">
            <input type="text" id="jobTitle" class="form-control" placeholder="Professional Title">
            
            <div class="form-row">
                <input type="email" id="email" class="form-control" placeholder="Email" >
                <input type="text" id="phone" class="form-control" placeholder="Phone" >
            </div>
            
            <div class="form-row">
                <input type="text" id="location" class="form-control" placeholder="Location" >
                <input type="text" id="website" class="form-control" placeholder="Website" >
            </div>
            
            <input type="text" id="linkedin" class="form-control" placeholder="LinkedIn">
            <input type="text" id="github" class="form-control" placeholder="GitHub">

            <!-- PROFESSIONAL SUMMARY -->
            <span class="section-label"><i class="fa-regular fa-pen me-2"></i>Professional Summary</span>
            <textarea id="about" class="form-control" rows="3" placeholder="Write a brief professional summary...">Results-driven Senior Software Engineer with 8+ years of experience building scalable web applications and leading development teams. Expertise in React, Node.js, and cloud infrastructure. Passionate about creating elegant solutions and mentoring junior developers.</textarea>

            <!-- SKILLS -->
            <span class="section-label"><i class="fa-regular fa-code me-2"></i>Skills</span>
            <div id="skillsContainer"></div>
            <div class="add-btn" id="addSkillBtn">
                <i class="fa-regular fa-plus"></i> Add Another Skill
            </div>

            <!-- LANGUAGES -->
            <span class="section-label"><i class="fa-regular fa-language me-2"></i>Languages</span>
            <div id="languagesContainer"></div>
            <div class="add-btn" id="addLanguageBtn">
                <i class="fa-regular fa-plus"></i> Add Another Language
            </div>

            <!-- EDUCATION -->
            <span class="section-label"><i class="fa-regular fa-graduation-cap me-2"></i>Education</span>
            <div id="educationContainer"></div>
            <div class="add-btn" id="addEducationBtn">
                <i class="fa-regular fa-plus"></i> Add Another Education
            </div>

            <!-- WORK EXPERIENCE -->
            <span class="section-label"><i class="fa-regular fa-briefcase me-2"></i>Work Experience</span>
            <div id="experienceContainer"></div>
            <div class="add-btn" id="addExperienceBtn">
                <i class="fa-regular fa-plus"></i> Add Another Experience
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn-save" id="saveBtn">
                    <i class="fa-regular fa-floppy-disk me-2"></i>Save Draft
                </button>
                <button class="btn-reset" id="resetBtn">
                    <i class="fa-regular fa-arrow-counterclockwise me-2"></i>Reset
                </button>
            </div>
        </div>
    </div>

    <!-- PREVIEW PANEL - Will be populated by JavaScript -->
    <div class="preview-panel">
        <!-- Template preview will be inserted here by JavaScript -->
        <div class="text-center p-5 text-muted" id="preview-loading">
            <div class="spinner-border text-primary mb-3" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Loading template preview...</p>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Main Builder JS -->
<script src="js/builder.js"></script>

<!-- Include Navbar -->
<script>
    fetch('components/navbar.html')
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML('afterbegin', data);
        })
        .catch(error => console.error('Error loading navbar:', error));
</script>

<!-- Include Footer -->
<script>
    fetch('components/footer.html')
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML('beforeend', data);
        })
        .catch(error => console.error('Error loading footer:', error));
</script>

</body>
</html>
