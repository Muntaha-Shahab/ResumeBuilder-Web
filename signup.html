<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeBuilder - Create Account</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== GLOBAL STYLES ===== */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fdfefe;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== BACKGROUND ANIMATION ===== */
        .area { 
            position: fixed; 
            width: 100%; 
            height: 100vh; 
            z-index: -1; 
            top: 0; 
            left: 0; 
            background: #fdfefe; 
        }
        
        .circles { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            margin: 0; 
            padding: 0; 
        }
        
        .circles li {
            position: absolute; 
            display: block; 
            list-style: none; 
            width: 20px; 
            height: 20px;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.2) 0%, rgba(13, 148, 136, 0.2) 100%);
            animation: animate 25s linear infinite; 
            bottom: -150px; 
            border-radius: 50%;
        }
        
        /* Bubble animation positions */
        .circles li:nth-child(1){ left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2){ left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .circles li:nth-child(3){ left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .circles li:nth-child(4){ left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .circles li:nth-child(5){ left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .circles li:nth-child(6){ left: 75%; width: 110px; height: 110px; animation-delay: 3s; }

        /* Keyframe animation */
        @keyframes animate {
            0%{ transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 50%; }
            100%{ transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 20%; }
        }

        /* ===== BUTTON STYLES ===== */
        .btn-teal {
            background: linear-gradient(90deg, #14b8a6 0%, #0d9488 100%);
            border: none;
            color: white;
            font-weight: 700;
            padding: 12px;
            border-radius: 12px;
            transition: transform 0.2s;
        }
        .btn-teal:hover { 
            color: white; 
            transform: scale(1.02); 
            opacity: 0.9; 
        }
        
        /* ===== CARD STYLES ===== */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 2.5rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(20, 184, 166, 0.1);
            max-width: 460px;
            width: 100%;
        }

        /* ===== FORM STYLES ===== */
        .form-control {
            border-radius: 12px;
            padding: 10px 15px;
            background-color: rgba(248, 249, 250, 0.5);
            border: 1px solid #eee;
            font-size: 0.9rem;
        }

        .form-control:focus {
            border-color: #14b8a6;
            box-shadow: 0 0 0 0.25rem rgba(20, 184, 166, 0.1);
        }

        /* ===== LOGO STYLES ===== */
        .logo-box {
            width: 40px;
            height: 40px;
            background-color: #14b8a6;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* ===== ALERT STYLES ===== */
        .alert-teal {
            background-color: rgba(20, 184, 166, 0.1);
            color: #0d4a4a;
            border: 1px solid rgba(20, 184, 166, 0.2);
            border-radius: 12px;
            font-size: 14px;
            padding: 12px;
        }
        
        .alert-error {
            background-color: rgba(220, 38, 38, 0.1);
            color: #991b1b;
            border: 1px solid rgba(220, 38, 38, 0.2);
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="area">
        <ul class="circles">
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
        </ul>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg px-4 py-3">
        <div class="container-fluid">
            <!-- Logo - Link to index.html (Developer 3) -->
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html" style="color: #0f4c4c;">
                <div class="logo-box">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
                ResumeBuilder
            </a>
            
            <!-- Navigation Links (Desktop) -->
            <div class="d-none d-md-flex gap-4 ms-auto me-4">
                <a href="index.html" class="text-decoration-none text-secondary small fw-bold text-uppercase">Home</a>
                <a href="login.html" class="text-decoration-none text-secondary small fw-bold text-uppercase">Login</a>
            </div>
            
            <!-- Sign Up Button -->
            <a href="signup.html" class="btn btn-teal px-4 py-2 shadow-sm">Sign Up</a>
        </div>
    </nav>

    <!-- Main Content - Sign Up Form -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="glass-card">
            <!-- Header -->
            <div class="text-center mb-4">
                <h1 class="h3 fw-bold mb-1">Create Account</h1>
                <p class="text-muted small">Join thousands of professionals</p>
            </div>

            <!-- Alert Message (Hidden by default) -->
            <div id="signupAlert" class="alert-teal mb-3 d-none">
                <i class="fa-solid fa-circle-info me-2"></i>
                <span id="alertMessage"></span>
            </div>

            <!-- Sign Up Form -->
            <form id="signupForm">
                <!-- Name and Email Row -->
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-bold text-secondary text-uppercase mb-1" style="font-size: 10px;">Full Name</label>
                        <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold text-secondary text-uppercase mb-1" style="font-size: 10px;">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="john@doe.com" required>
                    </div>
                </div>
                
                <!-- Password Field -->
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary text-uppercase mb-1" style="font-size: 10px;">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    <div class="form-text text-muted small">Minimum 6 characters</div>
                </div>
                
                <!-- Terms Checkbox -->
                <div class="mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label small text-muted" for="terms">
                            I agree to the <a href="#" class="text-decoration-none" style="color: #14b8a6;">Terms</a> and <a href="#" class="text-decoration-none" style="color: #14b8a6;">Privacy Policy</a>
                        </label>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-teal w-100 mt-2 mb-3">Start Building for Free</button>

                <!-- Divider -->
                <div class="text-center position-relative mb-3">
                    <hr class="text-muted">
                    <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small fw-bold text-uppercase" style="font-size: 10px;">or</span>
                </div>

                <!-- Social Login Buttons -->
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <button type="button" class="btn btn-light border w-100 small fw-bold d-flex align-items-center justify-content-center gap-2" style="font-size: 12px;" onclick="showSocialMessage()">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="14" alt="Google"> Google
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-light border w-100 small fw-bold d-flex align-items-center justify-content-center gap-2" style="font-size: 12px;" onclick="showSocialMessage()">
                            <i class="fa-brands fa-github"></i> GitHub
                        </button>
                    </div>
                </div>

                <!-- Login Link -->
                <p class="text-center text-muted small mb-0">
                    Already have an account? <a href="login.html" class="text-decoration-none fw-bold" style="color: #14b8a6;">Log In</a>
                </p>
            </form>
        </div>
    </main>

    <!-- JavaScript for Signup Functionality -->
    <script>
        // Check if user is already logged in
        (function checkAuth() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                // If already logged in, redirect to dashboard
                window.location.href = 'dashboard.html';
            }
        })();

        // Sign Up Form Handler
        document.getElementById('signupForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const termsAccepted = document.getElementById('terms').checked;
            
            // Get alert elements
            const alertDiv = document.getElementById('signupAlert');
            const alertMessage = document.getElementById('alertMessage');
            
            // Validation
            if (!fullName || !email || !password) {
                showAlert('Please fill in all fields', 'error');
                return;
            }
            
            if (!termsAccepted) {
                showAlert('Please accept the Terms and Privacy Policy', 'error');
                return;
            }
            
            if (!email.includes('@') || !email.includes('.')) {
                showAlert('Please enter a valid email address', 'error');
                return;
            }
            
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters long', 'error');
                return;
            }
            
            // Get existing users from localStorage
            let users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Check if email already exists
            const userExists = users.some(user => user.email === email);
            
            if (userExists) {
                showAlert('An account with this email already exists. Please login.', 'error');
                return;
            }
            
            // Create new user object
            const newUser = {
                id: 'user_' + Date.now(),
                name: fullName,
                email: email,
                password: password, // Note: In production, NEVER store plain passwords
                createdAt: new Date().toISOString(),
                savedCVs: [] // Array to store user's saved CVs
            };
            
            // Add to users array
            users.push(newUser);
            
            // Save to localStorage
            localStorage.setItem('users', JSON.stringify(users));
            
            // Auto-login after signup
            const userSession = {
                id: newUser.id,
                name: newUser.name,
                email: newUser.email,
                loggedInAt: new Date().toISOString()
            };
            
            localStorage.setItem('currentUser', JSON.stringify(userSession));
            
            // Show success message
            showAlert('Account created successfully! Redirecting...', 'success');
            
            // Redirect to thankyou page after short delay
            setTimeout(() => {
                window.location.href = 'thankyou.html';
            }, 1500);
        });
        
        // Helper function to show alerts
        function showAlert(message, type) {
            const alertDiv = document.getElementById('signupAlert');
            const alertMessage = document.getElementById('alertMessage');
            
            alertMessage.textContent = message;
            alertDiv.classList.remove('d-none');
            
            // Style based on type
            if (type === 'error') {
                alertDiv.classList.add('alert-error');
                alertDiv.style.backgroundColor = 'rgba(220, 38, 38, 0.1)';
                alertDiv.style.color = '#991b1b';
                alertDiv.style.borderColor = 'rgba(220, 38, 38, 0.2)';
            } else {
                alertDiv.classList.remove('alert-error');
                alertDiv.style.backgroundColor = 'rgba(20, 184, 166, 0.1)';
                alertDiv.style.color = '#0d4a4a';
                alertDiv.style.borderColor = 'rgba(20, 184, 166, 0.2)';
            }
            
            // Auto hide after 3 seconds for success
            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.classList.add('d-none');
                }, 3000);
            }
        }
        
        // Social login message
        function showSocialMessage() {
            const alertDiv = document.getElementById('signupAlert');
            const alertMessage = document.getElementById('alertMessage');
            
            alertMessage.textContent = 'Social login will be available in the next update!';
            alertDiv.classList.remove('d-none');
            alertDiv.style.backgroundColor = 'rgba(20, 184, 166, 0.1)';
            alertDiv.style.color = '#0d4a4a';
            alertDiv.style.borderColor = 'rgba(20, 184, 166, 0.2)';
            
            setTimeout(() => {
                alertDiv.classList.add('d-none');
            }, 3000);
        }
        
        // Real-time password strength indicator (optional enhancement)
        document.getElementById('password')?.addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthIndicator = document.createElement('small');
            
            // You can add password strength feedback here if desired
        });
    </script>

         - Links to: index.html (Developer 3), login.html (Developer 2), thankyou.html (Developer 2)
         - After thankyou, users go to dashboard.html -> templates.html (Developer 1)

</body>
</html>
