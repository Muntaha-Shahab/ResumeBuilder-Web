<!-- Navbar JavaScript -->
<script>
    (function() {
        // Set active nav link based on current page
        function setActiveNavLink() {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            const navLinks = document.querySelectorAll('.nav-link');
            
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        // Check if user is logged in and update dashboard button
        function updateAuthButtons() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const dashboardBtn = document.getElementById('dashboardBtn');
            const createBtn = document.getElementById('createCvBtn');
            
            if (currentUser) {
                // User is logged in
                if (dashboardBtn) {
                    dashboardBtn.innerHTML = '<i class="fa-regular fa-user me-2"></i>Dashboard';
                    dashboardBtn.href = 'dashboard.html';
                }
            } else {
                // User is not logged in
                if (dashboardBtn) {
                    dashboardBtn.innerHTML = '<i class="fa-regular fa-user me-2"></i>Login';
                    dashboardBtn.href = 'login.html';
                }
            }
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setActiveNavLink();
                updateAuthButtons();
            });
        } else {
            setActiveNavLink();
            updateAuthButtons();
        }
    })();
</script>
