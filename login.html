<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeBuilder - Login</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts - Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== GLOBAL STYLES ===== */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #fdfefe; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* ===== BACKGROUND ANIMATION ===== */
        .area { 
            position: fixed; 
            width: 100%; 
            height: 100vh; 
            z-index: -1; 
            top: 0; 
            left: 0; 
            background: #fdfefe; 
        }
        
        .circles { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            margin: 0; 
            padding: 0; 
        }
        
        .circles li {
            position: absolute; 
            display: block; 
            list-style: none; 
            width: 20px; 
            height: 20px;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.2) 0%, rgba(13, 148, 136, 0.2) 100%);
            animation: animate 25s linear infinite; 
            bottom: -150px; 
            border-radius: 50%;
        }
        
        /* Bubble animation positions */
        .circles li:nth-child(1){ left: 10%; width: 100px; height: 100px; animation-delay: 0s; }
        .circles li:nth-child(2){ left: 80%; width: 40px; height: 40px; animation-delay: 3s; }
        .circles li:nth-child(3){ left: 40%; width: 120px; height: 120px; animation-delay: 1s; animation-duration: 20s; }
        .circles li:nth-child(4){ left: 65%; width: 70px; height: 70px; animation-delay: 5s; animation-duration: 18s; }
        .circles li:nth-child(5){ left: 85%; width: 50px; height: 50px; animation-delay: 7s; animation-duration: 22s; }
        .circles li:nth-child(6){ left: 25%; width: 90px; height: 90px; animation-delay: 2s; animation-duration: 15s; }
        .circles li:nth-child(7){ left: 15%; width: 60px; height: 60px; animation-delay: 4s; }
        
        /* Keyframe animation for floating bubbles */
        @keyframes animate {
            0%{ transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 50%; }
            100%{ transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 20%; }
        }

        /* ===== BUTTON STYLES ===== */
        .btn-teal {
            background: linear-gradient(90deg, #14b8a6 0%, #0d9488 100%);
            border: none; 
            color: white; 
            font-weight: 700; 
            padding: 12px; 
            border-radius: 12px; 
            transition: 0.2s;
        }
        .btn-teal:hover { 
            color: white; 
            transform: scale(1.02); 
        }
        
        /* ===== CARD STYLES ===== */
        .glass-card {
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7); 
            border-radius: 2.5rem;
            padding: 2.5rem; 
            box-shadow: 0 25px 50px -12px rgba(20, 184, 166, 0.1);
            max-width: 420px; 
            width: 100%;
        }

        /* ===== FORM STYLES ===== */
        .form-control { 
            border-radius: 12px; 
            padding: 12px; 
            background-color: rgba(248, 249, 250, 0.5); 
            border: 1px solid #eee; 
        }
        .form-control:focus { 
            border-color: #14b8a6; 
            box-shadow: 0 0 0 0.25rem rgba(20, 184, 166, 0.1); 
        }
        
        /* ===== LOGO STYLES ===== */
        .logo-box { 
            width: 40px; 
            height: 40px; 
            background-color: #14b8a6; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
        }
        
        /* ===== ALERT STYLES ===== */
        .alert-teal {
            background-color: rgba(20, 184, 166, 0.1);
            color: #0d4a4a;
            border: 1px solid rgba(20, 184, 166, 0.2);
            border-radius: 12px;
            font-size: 14px;
            padding: 12px;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="area">
        <ul class="circles">
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
        </ul>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar px-4 py-3">
        <div class="container-fluid">
            <!-- Logo and Brand - Link to index.html (Developer 3's page) -->
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html" style="color: #0f4c4c;">
                <div class="logo-box">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
                ResumeBuilder
            </a>
            <!-- Sign Up Button -->
            <a href="signup.html" class="btn btn-teal px-4 shadow-sm">Sign Up</a>
        </div>
    </nav>

    <!-- Main Content - Login Form -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="glass-card">
            <!-- Header -->
            <div class="text-center mb-4">
                <h1 class="h3 fw-bold mb-1">Welcome Back</h1>
                <p class="text-muted small">Log in to your account</p>
            </div>

            <!-- Alert Message (Hidden by default) -->
            <div id="loginAlert" class="alert-teal mb-3 d-none">
                <i class="fa-solid fa-circle-info me-2"></i>
                <span id="alertMessage"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Email Field -->
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary text-uppercase" style="font-size: 10px;">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
                </div>
                
                <!-- Password Field -->
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary text-uppercase" style="font-size: 10px;">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                
                <!-- Remember Me & Forgot Password -->
                <div class="d-flex justify-content-between align-items-center mb-4" style="font-size: 12px;">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label text-muted" for="remember">Stay signed in</label>
                    </div>
                    <a href="#" class="text-decoration-none fw-bold" style="color: #14b8a6;">Forgot?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-teal w-100 shadow-sm mb-3">Log In</button>

                <!-- Sign Up Link -->
                <p class="text-center text-muted small mb-0">
                    New here? <a href="signup.html" class="text-decoration-none fw-bold" style="color: #14b8a6;">Create account</a>
                </p>
            </form>
        </div>
    </main>

    <!-- JavaScript for Authentication -->
    <script>
        // Check if user is already logged in
        (function checkAuth() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                // If already logged in, redirect to dashboard
                window.location.href = 'dashboard.html';
            }
        })();

        // Login Form Handler
        document.getElementById('loginForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // Get alert elements
            const alertDiv = document.getElementById('loginAlert');
            const alertMessage = document.getElementById('alertMessage');
            
            // Basic validation
            if (!email || !password) {
                showAlert('Please fill in all fields', 'error');
                return;
            }
            
            if (!email.includes('@') || !email.includes('.')) {
                showAlert('Please enter a valid email address', 'error');
                return;
            }
            
            // Get users from localStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Find user with matching email and password
            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                // Successful login
                
                // Store current user session
                const userSession = {
                    name: user.name,
                    email: user.email,
                    loggedInAt: new Date().toISOString(),
                    remember: remember
                };
                
                localStorage.setItem('currentUser', JSON.stringify(userSession));
                
                // If remember me is checked, extend session
                if (remember) {
                    // Set a flag for extended session (you can use this later)
                    localStorage.setItem('rememberSession', 'true');
                }
                
                // Show success message
                showAlert('Login successful! Redirecting...', 'success');
                
                // Redirect to dashboard after short delay
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                // Failed login
                showAlert('Invalid email or password. Please try again.', 'error');
            }
        });
        
        // Helper function to show alerts
        function showAlert(message, type) {
            const alertDiv = document.getElementById('loginAlert');
            const alertMessage = document.getElementById('alertMessage');
            
            alertMessage.textContent = message;
            alertDiv.classList.remove('d-none');
            
            // Style based on type
            if (type === 'error') {
                alertDiv.style.backgroundColor = 'rgba(220, 38, 38, 0.1)';
                alertDiv.style.color = '#991b1b';
                alertDiv.style.borderColor = 'rgba(220, 38, 38, 0.2)';
            } else {
                alertDiv.style.backgroundColor = 'rgba(20, 184, 166, 0.1)';
                alertDiv.style.color = '#0d4a4a';
                alertDiv.style.borderColor = 'rgba(20, 184, 166, 0.2)';
            }
            
            // Auto hide after 3 seconds for success
            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.classList.add('d-none');
                }, 3000);
            }
        }
        
        // Add demo account for testing (optional - you can remove in production)
        (function createDemoAccount() {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Check if demo account already exists
            const demoExists = users.some(u => u.email === 'demo@resume.com');
            
            if (!demoExists) {
                // Add demo account
                users.push({
                    name: 'Demo User',
                    email: 'demo@resume.com',
                    password: 'demo123',
                    createdAt: new Date().toISOString()
                });
                
                localStorage.setItem('users', JSON.stringify(users));
                console.log('Demo account created: demo@resume.com / demo123');
            }
        })();
    </script>
    
    <!-- Connection Note: 
         - Links to: index.html (Developer 3), signup.html (Developer 2), dashboard.html (Developer 2)
         - Templates access after login via dashboard -> templates.html (Developer 1)
    -->
</body>
</html>
